name: Refresh GitHub activity widget

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-widget
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate themed activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py

      - name: Commit widget when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo "Activity widget unchanged."
          else
            git commit -m "chore: refresh self-hosted GitHub activity widget"
            git push
          fi
