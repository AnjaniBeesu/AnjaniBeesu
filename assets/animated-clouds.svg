<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
  <defs>
    <filter id="mist" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#dfe5ea" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".82" stop-color="#cfd6dc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#mist)" opacity=".9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-130 0; 100 0; -130 0" dur="32s" repeatCount="indefinite"/>
      <ellipse cx="230" cy="88" rx="210" ry="25" fill="url(#fog)"/>
      <ellipse cx="290" cy="78" rx="120" ry="18" fill="#ffffff" opacity=".15"/>
      <ellipse cx="170" cy="100" rx="135" ry="16" fill="#dfe5ea" opacity=".18"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="130 0; -100 0; 130 0" dur="39s" repeatCount="indefinite"/>
      <ellipse cx="720" cy="75" rx="245" ry="24" fill="url(#fog)"/>
      <ellipse cx="770" cy="90" rx="150" ry="18" fill="#ffffff" opacity=".17"/>
      <ellipse cx="650" cy="62" rx="115" ry="16" fill="#dfe5ea" opacity=".2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-70 0; 80 0; -70 0" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="490" cy="115" rx="270" ry="13" fill="#ffffff" opacity=".16"/>
    </g>
  </g>
</svg>